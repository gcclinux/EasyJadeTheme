name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npx --yes @vscode/vsce package --out EasyJadeTheme.vsix
      - run: npx --yes ovsx publish EasyJadeTheme.vsix --trusted-publishing
